<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1d3557">
<title>Radar emploi — Thomas</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f7fb;
  --card: #fff;
  --primary: #1d3557;
  --accent: #2a9d8f;
  --warn: #e76f51;
  --muted: #6b7280;
  --border: #e5e7eb;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: #222;
  line-height: 1.5;
  padding: 16px;
  max-width: 900px;
  margin: 0 auto;
}
header {
  background: var(--primary);
  color: #fff;
  padding: 24px 20px;
  border-radius: 10px;
  margin-bottom: 16px;
}
header h1 { font-size: 22px; margin-bottom: 6px; }
header p { font-size: 13px; opacity: 0.85; }
.stats {
  display: flex; gap: 8px; flex-wrap: wrap;
  margin: 16px 0;
}
.stat {
  background: var(--card); border-radius: 8px; padding: 10px 14px;
  flex: 1; min-width: 100px; text-align: center;
  border: 1px solid var(--border);
}
.stat .v { font-size: 22px; font-weight: 700; color: var(--primary); }
.stat .l { font-size: 11px; color: var(--muted); text-transform: uppercase; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.filter-btn {
  background: var(--card); border: 1px solid var(--border);
  padding: 8px 14px; border-radius: 20px; font-size: 13px;
  cursor: pointer; transition: all 0.15s;
}
.filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.offre {
  background: var(--card); border-radius: 10px; padding: 16px;
  margin-bottom: 12px; border: 1px solid var(--border);
}
.offre h2 { font-size: 16px; color: var(--primary); margin-bottom: 6px; }
.offre .meta { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
.offre .desc { font-size: 13px; color: #444; margin: 8px 0; }
.tags { display: flex; gap: 4px; flex-wrap: wrap; margin: 8px 0; }
.tag {
  background: #eef2ff; color: var(--primary); font-size: 11px;
  padding: 2px 8px; border-radius: 4px;
}
.tag.warn { background: #fff3cd; color: #856404; }
.tag.bonus { background: #d4edda; color: #155724; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.btn {
  display: inline-block; padding: 8px 14px; border-radius: 6px;
  text-decoration: none; font-size: 13px; font-weight: 500;
  border: none; cursor: pointer;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-secondary { background: var(--card); color: var(--primary); border: 1px solid var(--border); }
.btn-state { background: #f1f5f9; color: #475569; }
.btn-state.active { background: var(--accent); color: #fff; }
.candidature {
  display: none; margin-top: 12px; padding: 12px;
  background: #f8fafc; border-left: 3px solid var(--accent);
  border-radius: 4px; font-size: 13px; white-space: pre-wrap;
  font-family: ui-monospace, 'Cascadia Code', monospace;
}
.candidature.visible { display: block; }
.empty {
  text-align: center; padding: 40px 20px; background: var(--card);
  border-radius: 10px; border: 1px solid var(--border);
}
.score {
  display: inline-block; background: var(--primary); color: #fff;
  padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600;
}
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: #222; color: #fff; padding: 10px 20px; border-radius: 6px;
  font-size: 13px; opacity: 0; transition: opacity 0.2s;
  pointer-events: none;
}
.toast.show { opacity: 1; }
footer {
  text-align: center; padding: 20px 0; color: var(--muted);
  font-size: 12px;
}
</style>
</head>
<body>

<header>
  <h1>🚛 Radar emploi — Thomas</h1>
  <p>Dernière mise à jour : <strong>28/08/2026 à 16:58</strong></p>
  <p style="margin-top:6px;">Lorette 42420 + 25 km • Cariste, logistique, agroalimentaire</p>
</header>

<div class="stats">
  <div class="stat"><div class="v" id="stat-total">0</div><div class="l">Offres</div></div>
  <div class="stat"><div class="v" id="stat-cdi">0</div><div class="l">CDI</div></div>
  <div class="stat"><div class="v" id="stat-proche">0</div><div class="l">&lt; 15 km</div></div>
  <div class="stat"><div class="v" id="stat-haute">0</div><div class="l">Score ≥ 8</div></div>
</div>

<div class="filters" id="filters">
  <button class="filter-btn active" data-filter="all">Toutes</button>
  <button class="filter-btn" data-filter="cdi">CDI uniquement</button>
  <button class="filter-btn" data-filter="proche">Moins de 15 km</button>
  <button class="filter-btn" data-filter="non-vues">Non vues</button>
</div>

<div id="offres-container"></div>

<footer>
  Radar emploi v3 · GitHub Actions · 28/08/2026 à 16:58<br>
  Données : France Travail + Indeed
</footer>

<div class="toast" id="toast"></div>

<script>
const OFFRES = [
  {
    "titre": "Cariste H/F/X",
    "entreprise": "ATHENA INTERIM 43",
    "ville": "43 - Saint-Romain-Lachalm",
    "code_postal": "43620",
    "type_contrat": "Intérim - 18 Mois",
    "description": "Dans le cadre de son développement, notre client recherche 3 caristes (H/F).\n\nSous la responsabilité du Chef d'équipe, vos missions seront :\n\nTransporter des paquets de bois (1m x 1,20m x 6m)\n\nParticiper à la gestion des stocks\n\nEntretenir son matériel\n\nAssurer une maintenance de 1er niveau\n\nFlasher les paquets par zone\n\nPréparer le commandes\n\nRespecter les règles de sécurité\n\nRespecter les outils de travail\n\n  \n Travail en équipe Calme et méticuleux Soigneux de son matériel Saisie de base dans le logiciel informatique interne\n",
    "url": "https://candidat.francetravail.fr/offres/recherche/detail/6388767",
    "source": "francetravail",
    "score": 3,
    "distance_km": 0.0,
    "tags": [
      "+cariste"
    ],
    "candidature": "Bonjour,\n\nSuite à votre offre de Cariste H/F/X chez ATHENA INTERIM 43, je vous propose ma candidature.\nJe suis cariste CACES 3 avec plusieurs années d'expérience en environnement\nlogistique et industriel : conduite de chariot, chargement et déchargement\nde camions, préparation de commandes, picking et palettisation. Mes dernières\nmissions chez FIT (Heyrieux) et Plast Moul (Bourgoin-Jallieu) m'ont permis de\ntravailler dans le respect strict des consignes de sécurité.\n\nDisponible immédiatement, basé à Lorette, je peux intervenir rapidement sur 43 - Saint-Romain-Lachalm.\nMon CV est joint, je reste à votre disposition pour échanger.\n\nCordialement",
    "date_publication": "2026-08-28T14:35:27.316Z"
  },
  {
    "titre": "Préparateur / Préparateur(trice) de commandes H/F",
    "entreprise": "Non précisé",
    "ville": "38 - Reventin-Vaugris",
    "code_postal": "38121",
    "type_contrat": "Intérim - 1 Mois",
    "description": "Tu preferes etre en mouvement plutot que de rester assis toute la journee ? Tu es du genre a reperer rapidement le bon produit dans un rayon et a aimer quand les choses sont bien organisees ? Bonne nouvelle, on recherche un preparateur de commandes pour rejoindre le drive d'une grande surface situee a deux pas de Vienne.\n\nTa mission, si tu l'acceptes, consistera a preparer les commandes des clients avec efficacite et precision, du lundi au samedi. Arme(e) de ton chariot et de ton bon sens, tu parcourras les allees du drive pour selectionner les bons produits, verifier les quantites et t'assure",
    "url": "https://candidat.francetravail.fr/offres/recherche/detail/6385362",
    "source": "francetravail",
    "score": 2,
    "distance_km": 0.0,
    "tags": [
      "+préparateur de commandes"
    ],
    "candidature": "Bonjour,\n\nJe vous adresse ma candidature pour votre offre de Préparateur / Préparateur(trice) de commandes H/F chez Non précisé.\nAvec plus de 10 ans d'expérience en préparation de commandes, picking,\nconstitution de palettes, filmage et cerclage, je suis également titulaire\ndu CACES 3. Mes missions précédentes en intérim et en CDD m'ont habitué aux\nenvironnements logistiques exigeants.\n\nDisponible immédiatement, basé à Lorette à proximité de 38 - Reventin-Vaugris, je peux\ndémarrer rapidement. Vous trouverez mon CV en pièce jointe.\n\nCordialement",
    "date_publication": "2026-08-28T12:22:58.988Z"
  },
  {
    "titre": "Préparateur de Commandes (h/f) (H/F)",
    "entreprise": "ADECCO",
    "ville": "26 - Albon",
    "code_postal": "26140",
    "type_contrat": "Intérim - 1 Mois",
    "description": "L'agence Adecco recrute pour son client, spécialisé dans le domaine de l'affrètement et organisation des transports et basé à ALBON (26140), un Préparateur de Commandes (h/f) CACES 1B.\n\nNotre client est une entreprise renommée dans le secteur de l'affrètement et organisation des transports. Avec une solide réputation et une présence internationale, notre client offre un environnement de travail dynamique et stimulant.\n\nEn tant que Préparateur de Commandes (h/f), vous jouerez un rôle clé dans le développement de l'entreprise. Vos missions incluront :\n\n- Préparation des commandes en respectant l",
    "url": "https://candidat.francetravail.fr/offres/recherche/detail/213BBFP",
    "source": "francetravail",
    "score": 2,
    "distance_km": 0.0,
    "tags": [
      "+préparateur de commandes"
    ],
    "candidature": "Bonjour,\n\nJe vous adresse ma candidature pour votre offre de Préparateur de Commandes (h/f) (H/F) chez ADECCO.\nAvec plus de 10 ans d'expérience en préparation de commandes, picking,\nconstitution de palettes, filmage et cerclage, je suis également titulaire\ndu CACES 3. Mes missions précédentes en intérim et en CDD m'ont habitué aux\nenvironnements logistiques exigeants.\n\nDisponible immédiatement, basé à Lorette à proximité de 26 - Albon, je peux\ndémarrer rapidement. Vous trouverez mon CV en pièce jointe.\n\nCordialement",
    "date_publication": "2026-08-27T19:31:45.104Z"
  }
];
const STORAGE_KEY = 'radar_emploi_etats';

// Charger les états (vu/intéressé/postulé) depuis localStorage
function chargerEtats() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch (e) { return {}; }
}
function sauverEtats(etats) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(etats));
}
function cleOffre(o) {
  return (o.titre + '|' + o.entreprise + '|' + o.ville).toLowerCase();
}

let etats = chargerEtats();
let filtreActif = 'all';

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function renderOffres() {
  const container = document.getElementById('offres-container');
  const offresVisibles = OFFRES.filter(o => {
    const cle = cleOffre(o);
    const etat = etats[cle] || {};
    if (filtreActif === 'cdi') return /CDI/i.test(o.type_contrat);
    if (filtreActif === 'proche') return o.distance_km > 0 && o.distance_km < 15;
    if (filtreActif === 'non-vues') return !etat.vu;
    return true;
  });

  if (offresVisibles.length === 0) {
    container.innerHTML = '<div class="empty">Aucune offre ne correspond à ce filtre.</div>';
    return;
  }

  container.innerHTML = offresVisibles.map((o, idx) => {
    const cle = cleOffre(o);
    const etat = etats[cle] || {};
    const distance = o.distance_km > 0 ? ` • ~${o.distance_km.toFixed(0)} km` : '';
    const tagsHtml = (o.tags || []).slice(0, 5).map(t => {
      const cls = t.startsWith('⚠') ? 'tag warn' : (t.startsWith('⭐') ? 'tag bonus' : 'tag');
      return `<span class="${cls}">${escapeHtml(t)}</span>`;
    }).join('');

    return `
      <div class="offre" data-cle="${escapeHtml(cle)}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
          <h2>${escapeHtml(o.titre)}</h2>
          <span class="score">${o.score}</span>
        </div>
        <div class="meta">
          <strong>${escapeHtml(o.entreprise)}</strong> — ${escapeHtml(o.ville)}${distance}
          ${o.type_contrat ? ' • ' + escapeHtml(o.type_contrat) : ''}
          • ${escapeHtml(o.source)}
        </div>
        <div class="tags">${tagsHtml}</div>
        <div class="desc">${escapeHtml(o.description.slice(0, 280))}${o.description.length > 280 ? '...' : ''}</div>
        <div class="actions">
          <a href="${escapeHtml(o.url)}" target="_blank" rel="noopener" class="btn btn-primary"
             onclick="marquerVu('${escapeHtml(cle)}')">Postuler ↗</a>
          ${o.candidature ? `
            <button class="btn btn-secondary" onclick="toggleCandidature(${idx})">
              📝 Voir candidature
            </button>
            <button class="btn btn-secondary" onclick="copierCandidature(${idx})">
              📋 Copier
            </button>
          ` : ''}
          <button class="btn btn-state ${etat.interesse ? 'active' : ''}"
                  onclick="toggleEtat('${escapeHtml(cle)}', 'interesse')">⭐ Intéressé</button>
          <button class="btn btn-state ${etat.postule ? 'active' : ''}"
                  onclick="toggleEtat('${escapeHtml(cle)}', 'postule')">✓ Postulé</button>
        </div>
        ${o.candidature ? `
          <div class="candidature" id="cand-${idx}">${escapeHtml(o.candidature)}</div>
        ` : ''}
      </div>
    `;
  }).join('');
}

function marquerVu(cle) {
  if (!etats[cle]) etats[cle] = {};
  etats[cle].vu = true;
  sauverEtats(etats);
}

function toggleEtat(cle, champ) {
  if (!etats[cle]) etats[cle] = {};
  etats[cle][champ] = !etats[cle][champ];
  sauverEtats(etats);
  renderOffres();
}

function toggleCandidature(idx) {
  const el = document.getElementById('cand-' + idx);
  if (el) el.classList.toggle('visible');
}

function copierCandidature(idx) {
  const offresVisibles = OFFRES.filter(o => {
    const etat = etats[cleOffre(o)] || {};
    if (filtreActif === 'cdi') return /CDI/i.test(o.type_contrat);
    if (filtreActif === 'proche') return o.distance_km > 0 && o.distance_km < 15;
    if (filtreActif === 'non-vues') return !etat.vu;
    return true;
  });
  const offre = offresVisibles[idx];
  if (!offre || !offre.candidature) return;
  navigator.clipboard.writeText(offre.candidature).then(() => {
    showToast('✓ Texte copié — colle-le sur la plateforme !');
  }).catch(() => {
    showToast('❌ Impossible de copier');
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function updateStats() {
  document.getElementById('stat-total').textContent = OFFRES.length;
  document.getElementById('stat-cdi').textContent = OFFRES.filter(o => /CDI/i.test(o.type_contrat)).length;
  document.getElementById('stat-proche').textContent = OFFRES.filter(o => o.distance_km > 0 && o.distance_km < 15).length;
  document.getElementById('stat-haute').textContent = OFFRES.filter(o => o.score >= 8).length;
}

// Setup filtres
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filtreActif = btn.dataset.filter;
    renderOffres();
  });
});

updateStats();
renderOffres();
</script>

</body>
</html>
