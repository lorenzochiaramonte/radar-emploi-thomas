<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1d3557">
<title>Radar emploi — Thomas</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f7fb;
  --card: #fff;
  --primary: #1d3557;
  --accent: #2a9d8f;
  --warn: #e76f51;
  --muted: #6b7280;
  --border: #e5e7eb;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: #222;
  line-height: 1.5;
  padding: 16px;
  max-width: 900px;
  margin: 0 auto;
}
header {
  background: var(--primary);
  color: #fff;
  padding: 24px 20px;
  border-radius: 10px;
  margin-bottom: 16px;
}
header h1 { font-size: 22px; margin-bottom: 6px; }
header p { font-size: 13px; opacity: 0.85; }
.stats {
  display: flex; gap: 8px; flex-wrap: wrap;
  margin: 16px 0;
}
.stat {
  background: var(--card); border-radius: 8px; padding: 10px 14px;
  flex: 1; min-width: 100px; text-align: center;
  border: 1px solid var(--border);
}
.stat .v { font-size: 22px; font-weight: 700; color: var(--primary); }
.stat .l { font-size: 11px; color: var(--muted); text-transform: uppercase; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.filter-btn {
  background: var(--card); border: 1px solid var(--border);
  padding: 8px 14px; border-radius: 20px; font-size: 13px;
  cursor: pointer; transition: all 0.15s;
}
.filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.offre {
  background: var(--card); border-radius: 10px; padding: 16px;
  margin-bottom: 12px; border: 1px solid var(--border);
}
.offre h2 { font-size: 16px; color: var(--primary); margin-bottom: 6px; }
.offre .meta { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
.offre .desc { font-size: 13px; color: #444; margin: 8px 0; }
.tags { display: flex; gap: 4px; flex-wrap: wrap; margin: 8px 0; }
.tag {
  background: #eef2ff; color: var(--primary); font-size: 11px;
  padding: 2px 8px; border-radius: 4px;
}
.tag.warn { background: #fff3cd; color: #856404; }
.tag.bonus { background: #d4edda; color: #155724; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.btn {
  display: inline-block; padding: 8px 14px; border-radius: 6px;
  text-decoration: none; font-size: 13px; font-weight: 500;
  border: none; cursor: pointer;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-secondary { background: var(--card); color: var(--primary); border: 1px solid var(--border); }
.btn-state { background: #f1f5f9; color: #475569; }
.btn-state.active { background: var(--accent); color: #fff; }
.candidature {
  display: none; margin-top: 12px; padding: 12px;
  background: #f8fafc; border-left: 3px solid var(--accent);
  border-radius: 4px; font-size: 13px; white-space: pre-wrap;
  font-family: ui-monospace, 'Cascadia Code', monospace;
}
.candidature.visible { display: block; }
.empty {
  text-align: center; padding: 40px 20px; background: var(--card);
  border-radius: 10px; border: 1px solid var(--border);
}
.score {
  display: inline-block; background: var(--primary); color: #fff;
  padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600;
}
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: #222; color: #fff; padding: 10px 20px; border-radius: 6px;
  font-size: 13px; opacity: 0; transition: opacity 0.2s;
  pointer-events: none;
}
.toast.show { opacity: 1; }
footer {
  text-align: center; padding: 20px 0; color: var(--muted);
  font-size: 12px;
}
</style>
</head>
<body>

<header>
  <h1>🚛 Radar emploi — Thomas</h1>
  <p>Dernière mise à jour : <strong>06/08/2026 à 07:31</strong></p>
  <p style="margin-top:6px;">Lorette 42420 + 25 km • Cariste, logistique, agroalimentaire</p>
</header>

<div class="stats">
  <div class="stat"><div class="v" id="stat-total">0</div><div class="l">Offres</div></div>
  <div class="stat"><div class="v" id="stat-cdi">0</div><div class="l">CDI</div></div>
  <div class="stat"><div class="v" id="stat-proche">0</div><div class="l">&lt; 15 km</div></div>
  <div class="stat"><div class="v" id="stat-haute">0</div><div class="l">Score ≥ 8</div></div>
</div>

<div class="filters" id="filters">
  <button class="filter-btn active" data-filter="all">Toutes</button>
  <button class="filter-btn" data-filter="cdi">CDI uniquement</button>
  <button class="filter-btn" data-filter="proche">Moins de 15 km</button>
  <button class="filter-btn" data-filter="non-vues">Non vues</button>
</div>

<div id="offres-container"></div>

<footer>
  Radar emploi v3 · GitHub Actions · 06/08/2026 à 07:31<br>
  Données : France Travail + Indeed
</footer>

<div class="toast" id="toast"></div>

<script>
const OFFRES = [
  {
    "titre": "Préparateur / Préparatrice de commandes (H/F)",
    "entreprise": "ENGINEERING CONCEPTION MAINTENANCE",
    "ville": "69 - Montagny",
    "code_postal": "69700",
    "type_contrat": "CDI",
    "description": "Description du poste :\n\nVotre future mission\n\n\nDès votre embauche en CDII, vous démarrez une première mission longue (jusqu'à 18 mois) au poste de préparateur de commandes Préparation de commandes alimentaires en environnement frais\n\n\n-Utilisation d'outils de préparation adaptés\n\n\n-Respect des normes d'hygiène et de sécurité\n\n\n-Participation active au bon fonctionnement de la chaîne logistique\n\n\nCe que nous vous offrons\n\n\n-Contrat à Durée Indéterminée Intérimaire (CDII) : stabilité + accompagnement + visibilité\n\n\n-Embauche à partir du 1er mars\n\n\n-Base 35h au SMIC\n\n\nSur votre première mission T",
    "url": "https://candidat.francetravail.fr/offres/recherche/detail/5740845",
    "source": "francetravail",
    "score": 10,
    "distance_km": 0.0,
    "tags": [
      "+cariste",
      "+préparateur de commandes",
      "+préparation de commandes",

      "+cdi"
    ],
    "candidature": "Bonjour,\n\nVotre offre de Préparateur / Préparatrice de commandes (H/F) chez ENGINEERING CONCEPTION MAINTENANCE retient toute mon attention.\nJ'ai récemment travaillé chez Lustucru Frais comme opérateur de production\nagroalimentaire (conditionnement, mise en barquettes, approvisionnement de ligne)\nen respectant strictement les normes d'hygiène, de sécurité et de qualité.\nJe suis également cariste CACES 3 avec une solide expérience en logistique.\n\nDisponible immédiatement, basé à Lorette, je peux rejoindre rapidement votre\néquipe sur 69 - Montagny. Mon CV est joint, je reste à votre disposition.\n\nCordialement",
    "date_publication": "2026-08-06T03:20:07.000Z"
  },
  {
    "titre": "Cariste H/F",
    "entreprise": "Aquila Rh",
    "ville": "42 - Lorette",
    "code_postal": "42420",
    "type_contrat": "Intérim - 3 Mois",
    "description": "Aquila RH, première agence d'emploi implantée sur le secteur de Chasse sur Rhône.\n\n\nAquila RH, c'est la force d'un réseau, l'implication d'indépendants, la proximité d'acteurs locaux, pour vos emplois en intérim, CDD et CDI.\n\n\nNotre objectif : être à l'écoute de votre projet et devenir votre partenaire professionnel incontournable.\n\n\nNous recherchons pour notre client basé à Lorette un Cariste => CACES 3.5 OBLIGATOIRE !!\n\n\nVos missions\n\nService expédition sur le site de Lorette.\n\n\nMissions :\n- Picking\n- Emballage\n- Piece de plus de 30 kilos...\n\n\n\nProfil recherché\n\nVous avez de l'expérience en ",
    "url": "https://candidat.francetravail.fr/offres/recherche/detail/5745459",
    "source": "francetravail",
    "score": 10,
    "distance_km": 0.0,
    "tags": [
      "+caces 3",

    "candidature": "Bonjour,\n\nJe vous adresse ma candidature pour votre offre de Cariste H/F chez Aquila Rh.\nAvec plus de 10 ans d'expérience en préparation de commandes, picking,\nconstitution de palettes, filmage et cerclage, je suis également titulaire\ndu CACES 3. Mes missions précédentes en intérim et en CDD m'ont habitué aux\nenvironnements logistiques exigeants.\n\nDisponible immédiatement, basé à Lorette à proximité de 42 - Lorette, je peux\ndémarrer rapidement. Vous trouverez mon CV en pièce jointe.\n\nCordialement",
    "date_publication": "2026-08-06T07:11:51.430Z"
  },
  {
    "titre": "CARISTE CACES 3 (F/H)",
    "entreprise": "RANDSTAD",

    "description": "Randstad Inhouse, est un concept unique en France d'agence intérim hébergée au cœur du site de production de nos clients. Forte de plus de 250 agences, nous accompagnons chaque année plus de 65 000 intérimaires.\nL'esprit de famille incarne notre ADN : étant chez nos clients aux côtés de nos intérimaires, nous \"travaillons en famille\"!\nNous rejoindre, c'est également bénéficier de nombreux avantages proposés par notre CE et nos partenaires.\n\nnous recherchons pour le compte de nos clients spécialisés dans l'industrie et la logistique et basés sur les secteurs de Lyon et ses alentours des cariste",
    "url": "https://candidat.francetravail.fr/offres/recherche/detail/5745412",
    "source": "francetravail",
    "score": 8,
    "distance_km": 0.0,
    "tags": [
      "+caces 3",
      "+cariste",
      "+logistique",
      "+manutention"
    ],
    "candidature": "Bonjour,\n\nVotre offre de CARISTE CACES 3 (F/H) chez RANDSTAD retient toute mon attention.\nJ'ai récemment travaillé chez Lustucru Frais comme opérateur de production\nagroalimentaire (conditionnement, mise en barquettes, approvisionnement de ligne)\nen respectant strictement les normes d'hygiène, de sécurité et de qualité.\nJe suis également cariste CACES 3 avec une solide expérience en logistique.\n\nDisponible immédiatement, basé à Lorette, je peux rejoindre rapidement votre\néquipe sur 38 - Chasse-sur-Rhône. Mon CV est joint, je reste à votre disposition.\n\nCordialement",
    "date_publication": "2026-08-06T07:11:48.992Z"
  }
];
const STORAGE_KEY = 'radar_emploi_etats';

// Charger les états (vu/intéressé/postulé) depuis localStorage
function chargerEtats() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch (e) { return {}; }
}
function sauverEtats(etats) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(etats));
}
function cleOffre(o) {
  return (o.titre + '|' + o.entreprise + '|' + o.ville).toLowerCase();
}

let etats = chargerEtats();
let filtreActif = 'all';

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function renderOffres() {
  const container = document.getElementById('offres-container');
  const offresVisibles = OFFRES.filter(o => {
    const cle = cleOffre(o);
    const etat = etats[cle] || {};
    if (filtreActif === 'cdi') return /CDI/i.test(o.type_contrat);
    if (filtreActif === 'proche') return o.distance_km > 0 && o.distance_km < 15;
    if (filtreActif === 'non-vues') return !etat.vu;
    return true;
  });

  if (offresVisibles.length === 0) {
    container.innerHTML = '<div class="empty">Aucune offre ne correspond à ce filtre.</div>';
    return;
  }

  container.innerHTML = offresVisibles.map((o, idx) => {
    const cle = cleOffre(o);
    const etat = etats[cle] || {};
    const distance = o.distance_km > 0 ? ` • ~${o.distance_km.toFixed(0)} km` : '';
    const tagsHtml = (o.tags || []).slice(0, 5).map(t => {
      const cls = t.startsWith('⚠') ? 'tag warn' : (t.startsWith('⭐') ? 'tag bonus' : 'tag');
      return `<span class="${cls}">${escapeHtml(t)}</span>`;
    }).join('');

    return `
      <div class="offre" data-cle="${escapeHtml(cle)}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
          <h2>${escapeHtml(o.titre)}</h2>
          <span class="score">${o.score}</span>
        </div>
        <div class="meta">
          <strong>${escapeHtml(o.entreprise)}</strong> — ${escapeHtml(o.ville)}${distance}
          ${o.type_contrat ? ' • ' + escapeHtml(o.type_contrat) : ''}
          • ${escapeHtml(o.source)}
        </div>
        <div class="tags">${tagsHtml}</div>
        <div class="desc">${escapeHtml(o.description.slice(0, 280))}${o.description.length > 280 ? '...' : ''}</div>
        <div class="actions">
          <a href="${escapeHtml(o.url)}" target="_blank" rel="noopener" class="btn btn-primary"
             onclick="marquerVu('${escapeHtml(cle)}')">Postuler ↗</a>
          ${o.candidature ? `
            <button class="btn btn-secondary" onclick="toggleCandidature(${idx})">
              📝 Voir candidature
            </button>
            <button class="btn btn-secondary" onclick="copierCandidature(${idx})">
              📋 Copier
            </button>
          ` : ''}
          <button class="btn btn-state ${etat.interesse ? 'active' : ''}"
                  onclick="toggleEtat('${escapeHtml(cle)}', 'interesse')">⭐ Intéressé</button>
          <button class="btn btn-state ${etat.postule ? 'active' : ''}"
                  onclick="toggleEtat('${escapeHtml(cle)}', 'postule')">✓ Postulé</button>
        </div>
        ${o.candidature ? `
          <div class="candidature" id="cand-${idx}">${escapeHtml(o.candidature)}</div>
        ` : ''}
      </div>
    `;
  }).join('');
}

function marquerVu(cle) {
  if (!etats[cle]) etats[cle] = {};
  etats[cle].vu = true;
  sauverEtats(etats);
}

function toggleEtat(cle, champ) {
  if (!etats[cle]) etats[cle] = {};
  etats[cle][champ] = !etats[cle][champ];
  sauverEtats(etats);
  renderOffres();
}

function toggleCandidature(idx) {
  const el = document.getElementById('cand-' + idx);
  if (el) el.classList.toggle('visible');
}

function copierCandidature(idx) {
  const offresVisibles = OFFRES.filter(o => {
    const etat = etats[cleOffre(o)] || {};
    if (filtreActif === 'cdi') return /CDI/i.test(o.type_contrat);
    if (filtreActif === 'proche') return o.distance_km > 0 && o.distance_km < 15;
    if (filtreActif === 'non-vues') return !etat.vu;
    return true;
  });
  const offre = offresVisibles[idx];
  if (!offre || !offre.candidature) return;
  navigator.clipboard.writeText(offre.candidature).then(() => {
    showToast('✓ Texte copié — colle-le sur la plateforme !');
  }).catch(() => {
    showToast('❌ Impossible de copier');
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function updateStats() {
  document.getElementById('stat-total').textContent = OFFRES.length;
  document.getElementById('stat-cdi').textContent = OFFRES.filter(o => /CDI/i.test(o.type_contrat)).length;
  document.getElementById('stat-proche').textContent = OFFRES.filter(o => o.distance_km > 0 && o.distance_km < 15).length;
  document.getElementById('stat-haute').textContent = OFFRES.filter(o => o.score >= 8).length;
}

// Setup filtres
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filtreActif = btn.dataset.filter;
    renderOffres();
  });
});

updateStats();
renderOffres();
</script>

</body>
</html>
